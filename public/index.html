<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Club de Memis</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/fondo.webp">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 50%, #0e3728, #042318 75%);
    }

    /* La imagen cubre la pantalla como "cover"; todo lo que va encima se
       ubica en porcentajes de la imagen, así la casilla queda siempre en su lugar. */
    .stage {
      position: fixed; /* fija: así no agranda la página en el celular (al girarlo quedaba alejada) */
      left: 50%;
      top: 50%;
      width: max(100vw, calc(100vh * 1821 / 1025));
      aspect-ratio: 1821 / 1025;
      transform: translate(-50%, -50%);
      background: url('/fondo.webp') center / 100% 100% no-repeat;
      container-type: inline-size;
    }
    /* Pantallas verticales (celular): se agranda para que la carpeta ocupe el ancho */
    @media (max-aspect-ratio: 1 / 1) {
      .stage {
        width: 250vw;
        transform: translate(-47.8%, -50%);
        /* los bordes se funden con el fondo */
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent);
        mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent);
      }
    }

    .stage form { margin: 0; }

    .slot {
      position: absolute;
      left: 49.22%;
      top: 60.04%;
      width: 5.6cqw;
      height: 2.2cqw;
      transform: translate(-50%, -50%) rotate(-12deg);
    }
    .slot input {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 0.25cqw 0.35cqw 0;
      border: 0;
      background: transparent;
      color: #1f1d1a;
      font-family: 'Josefin Sans', 'Century Gothic', 'Futura', sans-serif;
      font-weight: 600;
      font-size: 1.05cqw;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      caret-color: #1f1d1a;
    }
    .slot::after { /* aviso sutil de que se puede escribir */
      content: '';
      position: absolute;
      inset: -0.15cqw;
      border-radius: 0.15cqw;
      pointer-events: none;
      box-shadow: 0 0 0 0.12cqw rgba(255, 255, 255, 0);
      transition: box-shadow 0.2s;
    }
    .slot:hover::after { box-shadow: 0 0 0 0.12cqw rgba(255, 255, 255, 0.3); }
    .slot.shake { animation: shake 0.45s; }
    @keyframes shake {
      0%, 100% { transform: translate(-50%, -50%) rotate(-12deg); }
      20% { transform: translate(-58%, -50%) rotate(-12deg); }
      40% { transform: translate(-43%, -50%) rotate(-12deg); }
      60% { transform: translate(-55%, -50%) rotate(-12deg); }
      80% { transform: translate(-47%, -50%) rotate(-12deg); }
    }

    /* Sello de "acceso denegado" */
    .denied {
      position: absolute;
      left: 49%;
      top: 68.5%;
      padding: 0.2cqw 0.7cqw;
      border: 0.22cqw solid #c41e24;
      border-radius: 0.3cqw;
      color: #c41e24;
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 600;
      font-size: 1.1cqw;
      letter-spacing: 0.14em;
      white-space: nowrap;
      transform: translate(-50%, -50%) rotate(-9deg) scale(1.6);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: multiply;
    }
    .denied.show { animation: stamp 2.4s ease-out forwards; }
    .denied.stay { opacity: 0.85; transform: translate(-50%, -50%) rotate(-9deg) scale(1); font-size: 0.85cqw; }
    @keyframes stamp {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-9deg) scale(1.6); }
      12% { opacity: 0.85; transform: translate(-50%, -50%) rotate(-9deg) scale(1); }
      75% { opacity: 0.85; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(-9deg) scale(1); }
    }

    /* Tintero y pincel (tinta.js): una capa encima de la portada */
    .tinta {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      overflow: clip; /* que no se pueda desplazar (el pincel sobresale por la derecha) */
      pointer-events: none;
    }
    .tinta.cargando { visibility: hidden; }
    .tinta > *, .t-pincel, .t-boton { position: absolute; left: 0; top: 0; }
    .t-tintero, .t-limpia, .t-lienzo { transform-origin: 0 0; }
    .t-pincel-wrap { width: 0; height: 0; will-change: transform; }
    .t-pincel { max-width: none; user-select: none; -webkit-user-drag: none; }
    .t-boton {
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .tinta.pintando .t-boton { cursor: default; }
    .t-boton:focus { outline: none; }
    .t-boton:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.55); outline-offset: 2px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) {
      .slot.shake, .denied.show { animation: none; }
      .denied.show { opacity: 0.85; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <form id="login" autocomplete="off">
      <div class="slot" id="slot">
        <label class="sr-only" for="password">Clave secreta</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required spellcheck="false">
      </div>
      <button class="sr-only" type="submit">Ingresar</button>
    </form>
    <div class="denied" id="denied" role="alert">Acceso denegado</div>
  </main>
  <div class="tinta cargando" id="tinta"></div>

  <script src="/auth.js"></script>
  <script src="/tinta.js" defer></script>
  <script>
    const form = document.getElementById('login');
    const input = document.getElementById('password');
    const slot = document.getElementById('slot');
    const denied = document.getElementById('denied');

    const go = (role) => location.replace(role === 'admin' ? '/admin' : '/tablero');

    // Cualquier click en la carpeta enfoca la casilla
    document.addEventListener('mousedown', (e) => {
      if (e.target === input) return;
      e.preventDefault(); // que el click no le saque el foco a la casilla
      // el pincel no: en el celular abriría el teclado y taparía la tinta
      if (e.target.closest && e.target.closest('.t-boton')) return;
      input.focus();
    });

    // Escribir apenas abre la portada: la tecla va a la casilla aunque todavía no tenga el foco
    // (si no, la primera letra se perdía y la clave salía mal)
    input.focus();
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const a = document.activeElement;
      // con el foco en un botón (el pincel, el de enviar), las letras siguen yendo a la casilla;
      // Enter y espacio quedan para el botón
      const enBoton = a && a.tagName === 'BUTTON' && e.key.length === 1 && e.key !== ' ';
      if (a && a !== document.body && !enBoton) return;
      if (e.key.length === 1 || e.key === 'Enter') {
        const n = input.value.length;
        input.focus();
        input.setSelectionRange(n, n); // que agregue al final, sin reemplazar lo ya escrito
      }
    }, true);

    // Si el tablero o el panel nos mandaron de vuelta, contar por qué
    const MOTIVOS = {
      'sin-cookie': 'El navegador no guardó la sesión',
      firma: 'La sesión no se reconoció',
      vencida: 'La sesión venció',
      ilegible: 'La sesión estaba dañada',
    };
    const salida = new URLSearchParams(location.search).get('salida');
    if (salida) {
      memisSession.clear(); // la sesión guardada ya no sirve
      history.replaceState(null, '', '/');
      denied.textContent = (MOTIVOS[salida] || 'Se cerró la sesión') + ' · ingresá de nuevo';
      denied.classList.add('stay');
      console.warn('Volviste a la portada. Motivo:', salida);
    }

    let busy = false;
    let retry = false; // Enter apretado mientras volvía otro intento
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) { retry = true; return; }
      busy = true;
      const sent = input.value;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: sent }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) throw new Error('Acceso denegado');
        // Cualquier otra cosa no es la clave: es el servidor (se ve distinto para no confundir)
        if (!r.ok) throw Object.assign(new Error('Falla del servidor'), { detail: r.status + ' ' + (data.error || '') });
        if (data.token) memisSession.set(data.token);
        retry = false;
        go(data.role);
      } catch (err) {
        if (err.detail || err.name === 'TypeError') console.error('Ingreso:', err.detail || err.message);
        denied.textContent = err.message === 'Acceso denegado' ? 'Acceso denegado' : 'Falla del servidor · probá de nuevo';
        for (const el of [slot, denied]) {
          el.classList.remove('shake', 'show', 'stay');
          void el.offsetWidth;
        }
        slot.classList.add('shake');
        denied.classList.add('show');
        // borrar solo si no se siguió escribiendo mientras volvía la respuesta
        if (input.value === sent) input.value = '';
      } finally {
        busy = false;
        if (retry) {
          retry = false;
          if (input.value) form.requestSubmit();
        }
      }
    });
  </script>
</body>
</html>
