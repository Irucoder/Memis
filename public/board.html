<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero de Evidencias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="room">
    <div class="lamp" aria-hidden="true"><div class="cord"></div><div class="shade"></div><div class="rim"></div><div class="bulb"></div></div>

    <header class="topbar">
      <div class="actions">
        <button class="btn small dark hidden" id="editBtn" type="button">Acomodar</button>
        <a class="btn small dark hidden" id="adminLink" href="/admin">Panel admin</a>
        <button class="btn small ghost" id="logoutBtn" type="button">Salir</button>
      </div>
    </header>

    <!-- Cuenta regresiva -->
    <section class="center-stage hidden" id="waitView">
      <div class="wall-papers" aria-hidden="true">
        <span style="left:3%;top:10%;transform:rotate(-8deg)"></span>
        <span style="left:1%;top:42%;transform:rotate(5deg)"></span>
        <span style="left:4%;top:72%;transform:rotate(-4deg)"></span>
        <span style="right:3%;top:8%;transform:rotate(7deg)"></span>
        <span style="right:1%;top:40%;transform:rotate(-6deg)"></span>
        <span style="right:4%;top:70%;transform:rotate(4deg)"></span>
      </div>
      <div class="countdown">
        <div class="label" id="cdLabel">La investigación se abre en</div>
        <div class="digits" id="cdDigits" aria-live="off">
          <div class="unit"><div class="num" id="cdH">--</div><div class="cap">horas</div></div>
          <div class="sep">:</div>
          <div class="unit"><div class="num" id="cdM">--</div><div class="cap">minutos</div></div>
          <div class="sep">:</div>
          <div class="unit"><div class="num" id="cdS">--</div><div class="cap">segundos</div></div>
        </div>
        <p class="when" id="cdWhen"></p>
      </div>
    </section>

    <!-- Tablero -->
    <section class="board-scroll hidden" id="boardView">
      <div class="board" id="board">
        <div class="board-empty hidden" id="boardEmpty"><span>EL TABLERO ESTÁ VACÍO… POR AHORA.</span></div>
        <svg class="threads" id="threads" aria-hidden="true"></svg>
      </div>
    </section>

    <button class="spool hidden" id="spool" type="button" aria-pressed="false" title="Conectar pistas con hilo">
      <span class="spool-body" aria-hidden="true">
        <span class="spool-tail"></span>
        <span class="spool-disc top"></span>
        <span class="spool-thread"></span>
        <span class="spool-disc bottom"></span>
      </span>
      <span class="spool-label" id="spoolLabel">Hilo rojo</span>
    </button>

    <button class="notepad hidden" id="notepad" type="button" title="Pegar un post-it en el corcho">
      <span class="notepad-body" aria-hidden="true"><span class="notepad-top"></span><span class="notepad-scribble">Idea…</span></span>
      <span class="spool-label">Post-it</span>
    </button>

    <div class="vignette" aria-hidden="true"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Documento ampliado">
    <button class="lb-close" id="lbClose" type="button" aria-label="Cerrar">×</button>
    <a class="btn small dark lb-download hidden" id="lbDownload" target="_blank" rel="noopener">Abrir original</a>
    <div class="lb-content" id="lbContent"></div>
  </div>

  <div class="edit-hint hidden" id="editHint">Rueda del mouse sobre una pista para rotarla · Shift + rueda para cambiar el tamaño</div>
  <div class="edit-hint hidden" id="threadHint"></div>
  <div class="thread-menu hidden" id="threadMenu"><button class="btn small" id="cutThread" type="button">✂ Cortar hilo</button></div>

  <script src="/board.js"></script>
</body>
</html>
